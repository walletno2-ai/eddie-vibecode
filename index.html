<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集入口網站</title>
    <!-- 引入 Google Fonts 提升賽博龐克風格質感 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. 全局樣式設定 (Global Styles)
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            background: #0d0e15;
            /* 背景動態漸層與賽博龐克網格 */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 0, 127, 0.15), transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15), transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* 主容器：毛玻璃效果 (Glassmorphism) */
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 24, 38, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.7),
                inset 0 0 15px rgba(0, 240, 255, 0.1),
                0 0 20px rgba(255, 0, 127, 0.2);
            text-align: center;
        }

        /* ==========================================
           2. 個人資訊區塊 (Profile Header)
           ========================================== */
        .profile-section {
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 大頭貼外框與脈衝動畫 */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff;
            position: relative;
            z-index: 2;
        }

        /* 霓虹光暈脈衝效果 */
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            border: 2px solid #ff007f;
            z-index: 1;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.3;
                box-shadow: 0 0 20px #ff007f;
            }
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }

        /* 標題與文字特效 */
        .profile-name {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            margin-bottom: 8px;
        }

        .profile-subtitle {
            font-size: 0.95rem;
            color: #a0aec0;
            letter-spacing: 1px;
        }

        /* ==========================================
           3. 選單網格區塊 (Grid & Buttons)
           ========================================== */
        .grid-container {
            display: grid;
            /* 響應式網格：自動適應尺寸，電腦端每行約 2~4 個 */
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
        }

        /* 按鈕基本樣式 */
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        /* 解鎖狀態按鈕 */
        .menu-btn.unlocked {
            background: rgba(0, 240, 255, 0.05);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        /* 酷炫滑鼠懸停 (Hover) 動畫效果 */
        .menu-btn.unlocked:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 127, 0.2));
            color: #ffffff;
            border-color: #ff007f;
            transform: translateY(-5px) scale(1.03);
            box-shadow: 
                0 8px 25px rgba(255, 0, 127, 0.4),
                0 0 15px rgba(0, 240, 255, 0.6);
        }

        /* Hover 時的光芒掃過動畫 */
        .menu-btn.unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.3), 
                transparent
            );
            transition: 0.5s;
        }

        .menu-btn.unlocked:hover::before {
            left: 100%;
        }

        /* 未解鎖 (灰色鎖定) 狀態按鈕 */
        .menu-btn.locked {
            background: rgba(255, 255, 255, 0.03);
            color: #555c6e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: not-allowed;
            user-select: none;
        }

        .menu-btn.locked:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        /* 鎖頭圖示距離調整 */
        .lock-icon {
            margin-right: 6px;
            font-style: normal;
        }

        /* ==========================================
           4. 響應式調整 (Mobile Responsive)
           ========================================== */
        @media (max-width: 600px) {
            .container {
                padding: 25px 15px;
            }

            .profile-name {
                font-size: 1.6rem;
            }

            /* 手機版雙欄排列 */
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .menu-btn {
                padding: 14px 8px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 個人資訊區塊 -->
        <header class="profile-section">
            <div class="avatar-wrapper">
                <!-- 預設假圖片 (Via Placeholder API) -->
                <img src="https://i.postimg.cc/6qkxpDwY/vibecode-wang-mei-zhao.jpg" alt="個人大頭貼" class="avatar">
            </div>
            <h1 class="profile-name">周定寓</h1>
            <p class="profile-subtitle">WEB DEVELOPMENT PORTFOLIO</p>
        </header>

        <!-- 2. 16 個關卡按鈕網格 -->
        <main class="grid-container">
            <!-- 已解鎖按鈕 1 -->
            <a href="w1/index.html" class="menu-btn unlocked">
                Week 1 - 數位名片
            </a>

            <!-- 已解鎖按鈕 2 -->
            <a href="w2/index.html" class="menu-btn unlocked">
                Week 2 - 今天吃甚麼?
            </a>

            <!-- 未解鎖按鈕 (3 至 16) -->
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 3 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 4 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 5 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 6 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 7 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 8 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 9 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 10 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 11 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 12 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 13 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 14 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 15 - 尚未解鎖</div>
            <div class="menu-btn locked"><i class="lock-icon">🔒</i> Week 16 - 尚未解鎖</div>
        </main>
    </div>

</body>
</html>
