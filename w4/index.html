<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希臘許願池 - 朋友動態留言板</title>
    <!-- 引入 Google 字型：Cinzel 營造古希臘神話感，Noto Serif TC 營造優雅中文語感 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           [設定區] 顏色與輪播秒數自訂變數
           ================================---------- */
        :root {
            /* 希臘風格色彩配置 */
            --greek-blue-deep: #003366;     /* 深愛琴海藍 */
            --greek-blue-sky: #1E90FF;      /* 天空藍 */
            --greek-marble-bg: #f4f7f6;     /* 大理石淺灰白底色 */
            --greek-gold: #D4AF37;          /* 許願池金幣／神殿金邊 */
            --greek-gold-glow: rgba(212, 175, 55, 0.6); /* 金色發光暈影 */
            --card-parchment: #fffdf9;      /* 羊皮紙卡片背景色 */
            --text-dark: #2c3e50;           /* 深色文字 */
            --text-muted: #7f8c8d;          /* 灰階次要文字 */
            
            /* [修改區] 輪播秒數設定：每隔幾秒切換一張卡片高亮 */
            --carousel-interval: 3s; 
        }

        /* 全域樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            /* 希臘許願池背景：結合地中海藍與大理石質感的柔和漸層 */
            background: linear-gradient(135deg, #0a2540 0%, #1e3c72 50%, #2a5298 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* 頂部標題區 */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
            margin-bottom: 10px;
        }

        header h1 span {
            color: var(--greek-gold);
        }

        header p {
            color: #dcdde1;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 讀取中動畫樣式 */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #fff;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--greek-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ==========================================
           瀑布流排版 (Masonry Layout) 區塊
           ================================---------- */
        .masonry-wall {
            /* 使用 CSS 欄位實現響應式瀑布流 */
            column-count: 3;
            column-gap: 25px;
            width: 100%;
        }

        /* 響應式調整欄數 */
        @media (max-width: 900px) {
            .masonry-wall {
                column-count: 2;
            }
        }
        @media (max-width: 600px) {
            .masonry-wall {
                column-count: 1;
            }
        }

        /* 留言卡片基礎樣式 */
        .wish-card {
            break-inside: avoid;
            background: var(--card-parchment);
            margin-bottom: 25px;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 1;
            filter: blur(0px);
            transform: scale(1);
        }

        /* 卡片裝飾：仿希臘神殿石刻小邊框 */
        .wish-card::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            pointer-events: none;
        }

        /* 卡片內部元素 */
        .wish-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .wish-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--greek-blue-deep);
        }

        .wish-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .wish-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-dark);
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* ==========================================
           隨時間輪播特效 (Highlight / Dim)
           ================================---------- */
        /* 當卡片被選中時的高亮狀態 */
        .wish-card.highlight {
            transform: scale(1.05) translateY(-5px);
            border-color: var(--greek-gold);
            box-shadow: 0 12px 30px var(--greek-gold-glow), 0 0 20px rgba(255, 255, 255, 0.4);
            z-index: 10;
            filter: blur(0px) !important;
            opacity: 1 !important;
            background: #ffffff;
        }

        /* 當輪播啟動時，未被選中的卡片自動變暗、模糊 */
        .masonry-wall.active-carousel .wish-card {
            opacity: 0.4;
            filter: blur(2px);
            transform: scale(0.97);
        }

        /* 牆面啟動輪播時，特別指名高亮的卡片恢復清晰明亮 */
        .masonry-wall.active-carousel .wish-card.highlight {
            opacity: 1;
            filter: blur(0px);
            transform: scale(1.05) translateY(-5px);
        }
    </style>
</head>
<body>

    <header>
        <h1>希臘許願池 <span>★</span> 動態留言板</h1>
        <p>聆聽來自遠方友人的祝福與心聲，見證每一刻的閃耀迴響</p>
    </header>

    <div class="container">
        <!-- 讀取中動畫 -->
        <div id="loading">
            <div class="spinner"></div>
            <div>正在向希臘許願池汲取留言中...</div>
        </div>

        <!-- 瀑布流留言牆容器 -->
        <div id="wall" class="masonry-wall" style="display: none;"></div>
    </div>

    <script>
        // Google 試算表 CSV 網址
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRnmZAqP6NPKVPfg5q7wpuwAxOtjvfnhfqcZrUb8rDIvM7_vM2r0Z8OeSYWU2BZkjbg7TbxU66A-RWM/pub?output=csv';

        /**
         * 穩健的 CSV 解析器（能正確處理欄位內容中包含逗號與引號的情況）
         */
        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let row = [];
                let insideQuotes = false;
                let entry = '';
                
                for (let charIdx = 0; charIdx < line.length; charIdx++) {
                    let char = line[charIdx];
                    
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());
                result.push(row);
            }
            return result;
        }

        /**
         * 非同步取得並渲染留言板資料
         */
        async function fetchWishes() {
            const loadingEl = document.getElementById('loading');
            const wallEl = document.getElementById('wall');

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('網路連線異常，無法取得資料');
                
                const csvText = await response.text();
                const rawData = parseCSV(csvText);

                // 將解析後的資料整理成物件陣列 (假設順序為：時間戳記、名字、悄悄話)
                const wishes = rawData.map(row => ({
                    time: row[0] || '未知時間',
                    name: row[1] || '無名訪客',
                    message: row[2] || '這是一個神祕的空白願望...'
                })).reverse(); // 反轉陣列讓最新留言排在前面

                // 清空並隱藏載入動畫
                loadingEl.style.display = 'none';
                wallEl.style.display = 'block';

                // 動態生成卡片 HTML
                renderCards(wishes);

                // 啟動輪播特效
                initCarousel();

            } catch (error) {
                console.error(error);
                loadingEl.innerHTML = `<div style="color: #ff6b6b;">載入失敗，請檢查網路或 CSV 連結是否正確。</div>`;
            }
        }

        /**
         * 動態生成留言卡片到 DOM 中
         */
        function renderCards(wishes) {
            const wallEl = document.getElementById('wall');
            wallEl.innerHTML = '';

            wishes.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'wish-card';
                card.dataset.index = index; // 記錄卡片索引
                
                card.innerHTML = `
                    <div class="wish-header">
                        <span class="wish-name">🏛️ ${escapeHtml(item.name)}</span>
                        <span class="wish-time">${escapeHtml(item.time)}</span>
                    </div>
                    <div class="wish-content">${escapeHtml(item.message)}</div>
                `;
                wallEl.appendChild(card);
            });
        }

        /**
         * 防止 XSS 攻擊的跳脫函式
         */
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        /**
         * 初始化輪播與高亮特效
         */
        function initCarousel() {
            const wallEl = document.getElementById('wall');
            const cards = wallEl.querySelectorAll('.wish-card');
            
            if (cards.length === 0) return;

            let currentIndex = 0;

            // 啟用整體輪播模糊沈浸模式
            wallEl.classList.add('active-carousel');

            // 立即高亮第一張
            cards[currentIndex].classList.add('highlight');

            // 設定計時器：每隔指定秒數切換下一張
            // [修改區] 若需更改輪播速度，可直接調整上方 CSS :root 變數 `--carousel-interval`
            const intervalTime = 3000; // 3000毫秒 = 3秒

            setInterval(() => {
                // 移除當前卡片的高亮
                cards[currentIndex].classList.remove('highlight');

                // 計算下一張卡片索引（循環播放）
                currentIndex = (currentIndex + 1) % cards.length;

                // 為下一張卡片加上高亮
                cards[currentIndex].classList.add('highlight');

                // 讓高亮卡片自動平滑滾動至視野中心（選用，確保閱讀體驗流暢）
                cards[currentIndex].scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest'
                });

            }, intervalTime);
        }

        // 頁面載入完成後執行
        window.addEventListener('DOMContentLoaded', fetchWishes);
    </script>
</body>
</html>
