<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復古風自定義迷因產生器</title>
    <!-- 引入 Google Fonts 復古/厚重字體：Press Start 2P 或 Oswald 搭配 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik+Mono+One&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    <!-- 引入 html2canvas CDN 供截圖下載使用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* CSS 樣式設定：復古風主題與 RWD 響應式佈局 */
        :root {
            --bg-color: #f4ecd8; /* 復古泛黃紙張色 */
            --panel-bg: #fffcf0;
            --border-color: #3b2f2f; /* 復古深咖啡色邊框 */
            --accent-color: #d9534f; /* 復古紅 */
            --accent-hover: #c9302c;
            --text-color: #3b2f2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            /* 復古橫條紋背景點綴 */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0, rgba(0,0,0,0.02) 10px, transparent 0, transparent 20px);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 1.8rem;
            color: var(--text-color);
            text-shadow: 3px 3px 0px #e0c9a6;
            letter-spacing: 2px;
        }

        header p {
            font-size: 0.95rem;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* 主容器：RWD 雙欄排版 (桌機左右、手機上下) */
        .container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0px var(--border-color);
            padding: 25px;
            border-radius: 4px;
        }

        /* 控制面板區 */
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
        }

        .control-group input[type="text"],
        .control-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            background: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="text"]:focus {
            background-color: #fffdf5;
            box-shadow: 3px 3px 0px var(--border-color);
        }

        /* 滑桿微調樣式 */
        .control-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* 下載按鈕樣式：復古粗框與立體陰影 */
        .download-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: 3px solid var(--border-color);
            padding: 12px;
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: all 0.1s ease;
            text-align: center;
            border-radius: 2px;
            margin-top: 10px;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .download-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        /* 迷因即時預覽區 */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #e8dfc8;
            border: 3px dashed var(--border-color);
            padding: 20px;
            position: relative;
            min-height: 350px;
        }

        /* 迷因圖片外框容器 (html2canvas 截圖目標範圍) */
        #meme-card {
            position: relative;
            width: 100%;
            max-width: 450px;
            background-color: #000;
            border: 3px solid var(--border-color);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
            line-height: 0; /* 消除圖片底部空隙 */
            overflow: hidden;
            user-select: none;
        }

        #meme-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            min-height: 250px;
            background-color: #333;
        }

        /* 迷因文字共通樣式：粗邊框黑體確保任何背景皆清晰可見 */
        .meme-text {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            font-family: 'Rubik Mono One', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            color: #ffffff;
            /* 多重黑色陰影組合，形成粗邊框效果 */
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px  4px 8px rgba(0,0,0,0.6);
            text-transform: uppercase;
            word-break: break-all;
            pointer-events: none; /* 避免文字擋住滑鼠操作 */
        }

        /* 上方與下方文字初始垂直位置 */
        #top-text-display {
            top: 15px;
        }

        #bottom-text-display {
            bottom: 15px;
        }

        /* 響應式 RWD 調整：螢幕小於 768px 時改為上下單欄排版 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 15px;
            }
            header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>復古迷因產生器</h1>
        <p>上傳你的圖片，即時加入趣味文字與復古特效！</p>
    </header>

    <div class="container">
        <!-- 左側：控制面板區 -->
        <div class="control-panel">
            <!-- 1. 圖片上傳 (本機檔案讀取，避開 CORS) -->
            <div class="control-group">
                <label for="image-upload">選擇底圖：</label>
                <input type="file" id="image-upload" accept="image/*">
            </div>

            <!-- 2. 雙層文字輸入 -->
            <div class="control-group">
                <label for="top-text-input">上方文字：</label>
                <input type="text" id="top-text-input" placeholder="請輸入上方文字..." value="當工程師第一天">
            </div>

            <div class="control-group">
                <label for="bottom-text-input">下方文字：</label>
                <input type="text" id="bottom-text-input" placeholder="請輸入下方文字..." value="跟想像中完全不一樣">
            </div>

            <!-- 3. 參數滑桿控制 -->
            <div class="control-group">
                <label for="font-size-range">字體大小： <span id="font-size-val">24px</span></label>
                <input type="range" id="font-size-range" min="12" max="48" value="24">
            </div>

            <div class="control-group">
                <label for="top-pos-range">上方文字垂直位置： <span id="top-pos-val">15%</span></label>
                <input type="range" id="top-pos-range" min="2" max="80" value="15">
            </div>

            <div class="control-group">
                <label for="bottom-pos-range">下方文字垂直位置： <span id="bottom-pos-val">15%</span></label>
                <input type="range" id="bottom-pos-range" min="2" max="80" value="15">
            </div>

            <!-- 4. 一鍵下載按鈕 -->
            <button class="download-btn" id="download-btn">下載迷因 (my-meme.png)</button>
        </div>

        <!-- 右側：迷因即時預覽區 -->
        <div class="preview-panel">
            <!-- 截圖範圍卡片 -->
            <div id="meme-card">
                <img id="meme-image" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80" alt="預設迷因底圖">
                <div id="top-text-display" class="meme-text">當工程師第一天</div>
                <div id="bottom-text-display" class="meme-text">跟想像中完全不一樣</div>
            </div>
        </div>
    </div>

    <script>
        // JavaScript 互動邏輯

        // 取得 DOM 元素
        const imageUpload = document.getElementById('image-upload');
        const memeImage = document.getElementById('meme-image');
        const topTextInput = document.getElementById('top-text-input');
        const bottomTextInput = document.getElementById('bottom-text-input');
        const topTextDisplay = document.getElementById('top-text-display');
        const bottomTextDisplay = document.getElementById('bottom-text-display');
        
        const fontSizeRange = document.getElementById('font-size-range');
        const fontSizeVal = document.getElementById('font-size-val');
        const topPosRange = document.getElementById('top-pos-range');
        const topPosVal = document.getElementById('top-pos-val');
        const bottomPosRange = document.getElementById('bottom-pos-range');
        const bottomPosVal = document.getElementById('bottom-pos-val');
        
        const memeCard = document.getElementById('meme-card');
        const downloadBtn = document.getElementById('download-btn');

        // 1. 處理本機圖片上傳與預覽 (使用 FileReader 避開 CORS 限制)
        imageUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    memeImage.src = e.target.result; // 將圖片轉換為 Base64 賦值給 img src
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. 即時同步文字輸入
        topTextInput.addEventListener('input', function() {
            topTextDisplay.textContent = this.value;
        });

        bottomTextInput.addEventListener('input', function() {
            bottomTextDisplay.textContent = this.value;
        });

        // 3. 滑桿控制：字體大小
        fontSizeRange.addEventListener('input', function() {
            const size = this.value + 'px';
            fontSizeVal.textContent = size;
            topTextDisplay.style.fontSize = size;
            bottomTextDisplay.style.fontSize = size;
        });

        // 4. 滑桿控制：上方文字垂直位置 (使用百分比控制距頂端距離)
        topPosRange.addEventListener('input', function() {
            const pos = this.value + '%';
            topPosVal.textContent = pos;
            topTextDisplay.style.top = pos;
            topTextDisplay.style.bottom = 'auto'; // 清除衝突樣式
        });

        // 5. 滑桿控制：下方文字垂直位置 (使用百分比控制距底端距離)
        bottomPosRange.addEventListener('input', function() {
            const pos = this.value + '%';
            bottomPosVal.textContent = pos;
            bottomTextDisplay.style.bottom = pos;
            bottomTextDisplay.style.top = 'auto'; // 清除衝突樣式
        });

        // 6. 一鍵下載圖檔 (使用 html2canvas)
        downloadBtn.addEventListener('click', function() {
            // 變更按鈕文字提供互動反饋
            downloadBtn.textContent = "生成圖片中...";
            downloadBtn.disabled = true;

            html2canvas(memeCard, {
                useCORS: true, // 允許載入跨域圖片
                scale: 2       // 提高解析度讓下載圖片更清晰
            }).then(canvas => {
                // 建立一個隱藏的下載超連結
                const link = document.createElement('a');
                link.download = 'my-meme.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                // 恢復按鈕狀態
                downloadBtn.textContent = "下載迷因 (my-meme.png)";
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error("截圖失敗：", err);
                alert("圖片下載失敗，請稍後再試！");
                downloadBtn.textContent = "下載迷因 (my-meme.png)";
                downloadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
